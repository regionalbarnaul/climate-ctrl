<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Климат контроль</title>
<style>
:root{
  --car-img:url(car.jpg);
  --bg:#060a10;--accent:#5ce1e6;--accent-dim:rgba(92,225,230,.25);
  --glass:rgba(255,255,255,.06);--glass-strong:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.10);--border-active:rgba(92,225,230,.6);
  --danger:#ff4d5e;--flow-opacity:0;
  --wind-color:#6ff3ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
body{background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;padding:8px;height:100vh;overflow:hidden;color:#fff}
.panel{width:100%;max-width:380px;height:100%;max-height:98vh;border-radius:24px;overflow:hidden;
  position:relative;
  background:radial-gradient(120% 80% at 50% 0%, rgba(92,225,230,.10) 0%, transparent 60%),
    linear-gradient(180deg,#0d1524 0%,#0a0f1a 55%,#060a10 100%);
  display:flex;flex-direction:column;padding:10px;
  box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05);
  gap:6px;border:1px solid rgba(255,255,255,.04)}
.panel::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 16px);
  -webkit-mask:linear-gradient(180deg,#000,transparent 30%);
  mask:linear-gradient(180deg,#000,transparent 30%);pointer-events:none}
.panel>*{position:relative;z-index:1}

.temp-block{background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.03));
  border:1px solid var(--border);border-radius:18px;padding:8px 12px 10px;
  display:flex;flex-direction:column;gap:4px;align-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(0,0,0,.25)}
.audi-label{font-size:10px;font-weight:300;letter-spacing:8px;text-transform:uppercase;
  color:rgba(255,255,255,.70);padding-left:8px;cursor:pointer}
.audi-rings{width:46px;height:14px;color:rgba(255,255,255,.55);margin-bottom:2px}
.temp-square{min-width:108px;height:60px;padding:0 14px;border-radius:12px;
  border:1px solid rgba(92,225,230,.35);
  background:linear-gradient(180deg, rgba(92,225,230,.10), rgba(92,225,230,.02));
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 22px rgba(92,225,230,.12)}
.temp-value{font-size:28px;font-weight:200;line-height:1;color:#fff;
  text-shadow:0 0 12px rgba(92,225,230,.30);font-variant-numeric:tabular-nums;white-space:nowrap}
.temp-value .num{display:inline-block;transform:scaleY(0.75);transform-origin:center center;letter-spacing:-1px}
.temp-value sup{font-size:11px;font-weight:300;color:var(--accent);margin-left:2px;
  text-shadow:none;vertical-align:baseline;position:relative;top:-0.45em}
.temp-slider{width:calc(100% - 24px);margin:0 12px;height:6px;border-radius:6px;
  background:linear-gradient(90deg,#3d5af6 0%,#7a7a8c 50%,#ff5a5a 100%);
  -webkit-appearance:none;appearance:none;outline:none;cursor:pointer;
  box-shadow:inset 0 0 6px rgba(0,0,0,.35);margin-top:4px}
.temp-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;border:3px solid var(--accent);
  box-shadow:0 0 18px rgba(92,225,230,.75), 0 0 0 4px rgba(92,225,230,.12);cursor:pointer}
.temp-labels{display:flex;justify-content:space-between;font-size:10px;
  width:calc(100% - 24px);margin:0 12px;font-weight:300;letter-spacing:1px;color:rgba(255,255,255,.5)}

.center{flex:1;position:relative;min-height:200px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;border-radius:16px;
  background-color:#05080c;
  background-image:var(--car-img);
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  border:1px solid var(--border);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.center::after{content:'';position:absolute;inset:0;z-index:3;
  background:linear-gradient(180deg, rgba(6,10,16,.15) 0%, rgba(6,10,16,.45) 100%);pointer-events:none}
.center svg{position:relative;z-index:2;width:100%;height:100%}
#flow-wind,#flow-face,#flow-feet{opacity:var(--flow-opacity)}
.wind-body{fill:none;stroke-linecap:round;animation:blow-body 4s linear infinite;filter:blur(10px);opacity:0.12;stroke:var(--wind-color)}
.wind-core{fill:none;stroke-linecap:round;animation:blow 3s linear infinite;filter:blur(5px);opacity:0.22;stroke-dasharray:2 18;stroke:var(--wind-color)}
.wind{fill:none;stroke-linecap:round;animation:blow 2.2s linear infinite;filter:blur(1.5px);opacity:0.55;stroke-dasharray:5 40;stroke:var(--wind-color)}
.wind-turb{fill:none;stroke-linecap:round;animation:blow 1.4s linear infinite;filter:blur(2px);opacity:0.38;stroke-dasharray:3 30;stroke:var(--wind-color)}
@keyframes blow-body{0%{stroke-dashoffset:0;opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{stroke-dashoffset:-150;opacity:0;}}
@keyframes blow{0%{stroke-dashoffset:0;opacity:0;}15%{opacity:1;}85%{opacity:1;}100%{stroke-dashoffset:-200;opacity:0;}}

.lite-toggle{position:absolute;top:8px;right:8px;z-index:5;
  width:38px;height:38px;border-radius:50%;
  border:1px solid var(--border);background:rgba(0,0,0,.55);
  color:rgba(255,255,255,.45);cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center}
.lite-toggle svg{width:18px;height:18px;display:block}
.lite-toggle .bolt-fill{opacity:.15}
.lite-toggle.on{color:var(--accent);border-color:var(--border-active)}
.lite-toggle.on .bolt-fill{opacity:1}

.dir-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dir-btn{height:56px;border-radius:16px;border:1px solid var(--border);
  background:var(--glass);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.dir-btn svg{width:30px;height:30px;color:rgba(255,255,255,.75)}
.dir-btn.active{background:linear-gradient(180deg, rgba(92,225,230,.20), rgba(92,225,230,.06));
  border-color:var(--border-active);
  box-shadow:0 0 22px rgba(92,225,230,.35), inset 0 0 14px rgba(92,225,230,.18)}
.dir-btn.active svg{color:var(--accent)}

.fan-block{background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
  border:1px solid var(--border);border-radius:18px;padding:8px 14px;
  display:flex;align-items:center;gap:12px}
.fan-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--border);
  background:var(--glass);color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.fan-small svg{width:26px;height:26px}
.fan-big svg{width:40px;height:40px}
.fan-big{background:linear-gradient(180deg, rgba(92,225,230,.20), rgba(92,225,230,.05));
  border-color:var(--border-active)}
.fan-btn .blade,.fan-btn .hub{fill:currentColor;stroke:none}
.fan-big .blade,.fan-big .hub{fill:var(--accent)}
.fan-center{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.fan-value{font-size:22px;font-weight:300;line-height:1;min-height:22px}
.fan-label{min-height:36px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.fan-label svg{width:36px;height:36px;display:block}
.fan-bars{display:flex;gap:4px;width:100%;margin-top:3px}
.fan-seg{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.10)}
.fan-seg.active{background:var(--accent)}

.connect-btn{height:44px;border-radius:14px;border:1px solid var(--border-active);
  background:linear-gradient(180deg, rgba(92,225,230,.18), rgba(92,225,230,.04));
  color:var(--accent);font-weight:600;font-size:12px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.connect-btn.danger{border-color:rgba(255,77,94,.6);
  background:linear-gradient(180deg, rgba(255,77,94,.18), rgba(255,77,94,.04));
  color:var(--danger)}
.status{text-align:center;font-size:10px;opacity:.5;letter-spacing:1px;padding-bottom:2px}
.status.ok{color:var(--accent);opacity:1}

.calib-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);
  display:none;align-items:center;justify-content:center;z-index:999;padding:14px}
.calib-overlay.open{display:flex}
.calib-panel{width:100%;max-width:560px;max-height:90vh;
  background:#0d1524;border:1px solid var(--border-active);border-radius:18px;
  display:flex;flex-direction:column;padding:14px;gap:10px}
.calib-head{display:flex;align-items:center;justify-content:space-between;
  font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.calib-head button{background:transparent;border:1px solid var(--border);
  color:rgba(255,255,255,.7);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:12px}
.calib-log{flex:1;min-height:140px;max-height:220px;overflow-y:auto;
  background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:12px;
  padding:10px;font-family:'Courier New',monospace;font-size:12px;line-height:1.4;
  color:#a8f0f5;white-space:pre-wrap;word-break:break-all}
.calib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.calib-btn{height:40px;border-radius:10px;border:1px solid var(--border);
  background:var(--glass);color:#fff;font-size:12px;font-weight:600;cursor:pointer;padding:0}
.calib-btn:active{background:var(--glass-strong)}
.calib-btn.accent{border-color:var(--border-active);color:var(--accent);background:rgba(92,225,230,.08)}
.calib-btn.danger{border-color:rgba(255,77,94,.5);color:var(--danger)}

/* =========================================================
   LITE РЕЖИМ — абсолютно плоский. Без картинки, теней,
   градиентов, скруглений, анимаций, backdrop-filter.
   ========================================================= */
body.lite .panel{background:#0a0e16;border-radius:0;border:none;box-shadow:none}
body.lite .panel::before{display:none}
body.lite *{box-shadow:none !important;transition:none !important;text-shadow:none !important;
  background-image:none !important;border-radius:0 !important;filter:none !important}
body.lite .temp-block,
body.lite .fan-block,
body.lite .temp-square{background:#131c2c}
body.lite .dir-btn,
body.lite .fan-btn,
body.lite .calib-btn{background:#131c2c}
body.lite .dir-btn.active,
body.lite .fan-big{background:#1a3a3d;border-color:#5ce1e6}
body.lite .connect-btn{background:#0a1e20;border-color:#5ce1e6}
body.lite .connect-btn.danger{background:#1e0a0e;border-color:#ff4d5e}
body.lite .center{background-color:#000;background-image:none !important}
body.lite .center::after{display:none}
body.lite .lite-toggle{background:#1a1f2c}
body.lite .lite-toggle.on{background:#1a3a3d}
body.lite .calib-overlay{background:#000}
body.lite .calib-log{background:#000}
body.lite .wind,
body.lite .wind-core,
body.lite .wind-turb{animation:none !important;filter:none !important;
  stroke-dasharray:none !important;opacity:.55;stroke-width:1.5}
body.lite .wind-body{display:none}
body.lite .fan-seg{background:#1e2a3d}
body.lite .fan-seg.active{background:var(--accent)}

@media (orientation: landscape) and (max-height: 500px) {
  body{padding:4px}
  .panel{max-width:100%;max-height:100vh;height:100%;padding:6px;gap:4px;border-radius:12px;
    display:grid;grid-template-columns:minmax(200px,32%) 1fr;
    grid-template-rows:auto auto auto auto auto;
    grid-template-areas:"temp center" "dir center" "fan center" "conn center" "stat center";
    align-content:stretch}
  .temp-block{grid-area:temp;padding:4px 6px;gap:1px;border-radius:12px}
  .dir-grid{grid-area:dir;gap:4px}
  .fan-block{grid-area:fan;padding:3px 6px;gap:6px;border-radius:12px}
  .connect-btn{grid-area:conn;height:32px;font-size:10px;letter-spacing:2px;border-radius:10px}
  .status{grid-area:stat;font-size:9px;padding:0}
  .center{grid-area:center;min-height:0;height:100%;border-radius:12px}
  .audi-label{font-size:8px;letter-spacing:6px;padding-left:6px}
  .audi-rings{width:36px;height:10px;margin-bottom:1px}
  .temp-square{min-width:80px;height:38px;padding:0 8px;border-radius:8px}
  .temp-value{font-size:20px}.temp-value sup{font-size:9px}
  .temp-slider{height:4px;margin-top:2px;width:calc(100% - 12px);margin-left:6px;margin-right:6px}
  .temp-slider::-webkit-slider-thumb{width:16px;height:16px;border-width:2px}
  .temp-labels{font-size:8px;width:calc(100% - 12px);margin:0 6px}
  .dir-btn{height:38px;border-radius:10px}.dir-btn svg{width:20px;height:20px}
  .fan-btn{width:30px;height:30px}
  .fan-small svg{width:18px;height:18px}.fan-big svg{width:26px;height:26px}
  .fan-value{font-size:14px;min-height:14px}
  .fan-label{min-height:20px}.fan-label svg{width:20px;height:20px}
  .fan-seg{height:3px}
  .lite-toggle{width:30px;height:30px;top:4px;right:4px}
  .lite-toggle svg{width:14px;height:14px}
}

@media (orientation: landscape) and (min-width: 640px) and (max-width: 899px) {
  body{padding:8px}
  .panel{max-width:100%;max-height:100vh;height:100%;padding:12px;gap:8px;border-radius:16px;
    display:grid;grid-template-columns:minmax(230px,30%) 1fr;
    grid-template-rows:auto auto auto auto auto;
    grid-template-areas:"temp center" "dir center" "fan center" "conn center" "stat center";
    align-content:stretch}
  .temp-block{grid-area:temp;padding:8px 10px 10px;gap:4px}
  .dir-grid{grid-area:dir;gap:7px}
  .fan-block{grid-area:fan;padding:8px 12px;gap:10px}
  .connect-btn{grid-area:conn;height:48px;font-size:12px;letter-spacing:3px;border-radius:14px}
  .status{grid-area:stat;font-size:11px}
  .center{grid-area:center;min-height:0;height:100%}
  .audi-label{font-size:11px;letter-spacing:11px;padding-left:11px}
  .audi-rings{width:60px;height:20px;margin-bottom:5px}
  .temp-square{min-width:130px;height:74px;padding:0 14px}
  .temp-value{font-size:34px}.temp-value sup{font-size:15px}
  .temp-slider{height:7px;margin-top:5px}
  .temp-slider::-webkit-slider-thumb{width:26px;height:26px}
  .temp-labels{font-size:11px}
  .dir-btn{height:64px;border-radius:16px}.dir-btn svg{width:34px;height:34px}
  .fan-btn{width:52px;height:52px}
  .fan-small svg{width:28px;height:28px}.fan-big svg{width:42px;height:42px}
  .fan-value{font-size:24px;min-height:24px}
  .fan-label{min-height:36px}.fan-label svg{width:36px;height:36px}
  .fan-seg{height:5px}
}

@media (min-width: 900px) and (max-height: 780px) {
  body{padding:6px}
  .panel{max-width:100%;max-height:100vh;height:100%;padding:10px;gap:8px;
    display:grid;grid-template-columns:340px 1fr;grid-template-rows:1fr auto auto;
    grid-template-areas:"temp center" "dir center" "fan center" "conn center" "stat center";
    align-content:stretch;border-radius:14px}
  .temp-block{grid-area:temp;padding:8px 10px 10px;gap:4px}
  .dir-grid{grid-area:dir;gap:6px}
  .fan-block{grid-area:fan;padding:6px 12px;gap:10px}
  .connect-btn{grid-area:conn;height:40px;font-size:11px}
  .status{grid-area:stat;font-size:10px}
  .center{grid-area:center;min-height:0;height:100%}
  .audi-label{font-size:11px;letter-spacing:10px;padding-left:10px}
  .audi-rings{width:60px;height:18px;margin-bottom:4px}
  .temp-square{min-width:120px;height:64px}
  .temp-value{font-size:32px}.temp-value sup{font-size:13px}
  .dir-btn{height:56px}.dir-btn svg{width:30px;height:30px}
  .fan-btn{width:48px;height:48px}
  .fan-small svg{width:26px;height:26px}.fan-big svg{width:38px;height:38px}
  .fan-value{font-size:20px;min-height:20px}
  .fan-label{min-height:28px}.fan-label svg{width:28px;height:28px}
}

@media (min-width: 900px) and (min-height: 781px) {
  body{padding:14px}
  .panel{max-width:100%;max-height:100vh;height:100%;padding:18px;gap:12px;
    display:grid;grid-template-columns:400px 1fr;grid-template-rows:auto 1fr auto auto auto;
    grid-template-areas:"temp center" "dir center" "fan center" "conn center" "stat center";
    align-content:stretch;border-radius:20px}
  .temp-block{grid-area:temp;padding:16px;gap:10px}
  .dir-grid{grid-area:dir;gap:8px}
  .fan-block{grid-area:fan;padding:14px 18px;gap:16px}
  .connect-btn{grid-area:conn;align-self:end}
  .status{grid-area:stat;align-self:end}
  .center{grid-area:center;min-height:0;height:100%}
  .audi-label{font-size:14px;letter-spacing:14px;padding-left:14px}
  .audi-rings{width:90px;height:28px;margin-bottom:10px}
  .temp-square{min-width:180px;height:110px;border-radius:18px}
  .temp-value{font-size:46px}.temp-value sup{font-size:20px}
  .temp-slider{height:8px}
  .temp-slider::-webkit-slider-thumb{width:30px;height:30px}
  .temp-labels{font-size:14px}
  .dir-btn{height:96px;border-radius:22px}.dir-btn svg{width:48px;height:48px}
  .fan-btn{width:76px;height:76px}
  .fan-small svg{width:42px;height:42px}.fan-big svg{width:60px;height:60px}
  .fan-value{font-size:34px;min-height:34px}
  .fan-label{min-height:52px}.fan-label svg{width:52px;height:52px}
  .fan-seg{height:7px}
  .connect-btn{height:70px;font-size:16px;letter-spacing:4px;border-radius:18px}
  .status{font-size:14px}
}
</style>
</head>
<body>
<div class="panel">

  <div class="temp-block">
    <div class="audi-label" id="audiLabel">AUDI</div>
    <svg class="audi-rings" viewBox="0 0 88 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="14" cy="14" r="11"/><circle cx="34" cy="14" r="11"/>
      <circle cx="54" cy="14" r="11"/><circle cx="74" cy="14" r="11"/>
    </svg>
    <div class="temp-square">
      <div class="temp-value"><span class="num" id="tVal">20.0</span><sup>°C</sup></div>
    </div>
    <input type="range" id="tempSlider" class="temp-slider" min="16" max="30" step="0.5" value="20">
    <div class="temp-labels"><span>16°</span><span>30°</span></div>
  </div>

  <div class="center" id="centerBlock">
    <svg viewBox="0 0 200 170" preserveAspectRatio="xMidYMid slice">
      <g id="flow-wind" style="display:none" transform="translate(65 70) rotate(-40)">
        <path class="wind-body" d="M0 0 L55 0" stroke-width="35"/>
        <path class="wind-core" d="M0 -5 L55 -5" stroke-width="7"/>
        <path class="wind-core" d="M0 0 L55 0" stroke-width="7"/>
        <path class="wind-core" d="M0 5 L55 5" stroke-width="7"/>
        <path class="wind" d="M0 -12 L55 -12" stroke-width="1.3"/>
        <path class="wind" d="M0 -7 L55 -7" stroke-width="1.4"/>
        <path class="wind" d="M0 -2 L55 -2" stroke-width="1.3"/>
        <path class="wind" d="M0 3 L55 3" stroke-width="1.4"/>
        <path class="wind" d="M0 8 L55 8" stroke-width="1.3"/>
        <path class="wind" d="M0 13 L55 13" stroke-width="1.4"/>
        <path class="wind-turb" d="M0 -10 L55 -10" stroke-width="1"/>
        <path class="wind-turb" d="M0 7 L55 7" stroke-width="1"/>
        <path class="wind-turb" d="M0 15 L55 15" stroke-width="1"/>
      </g>
      <g id="flow-face" style="display:none" transform="translate(63 72) rotate(-5)">
        <path class="wind-body" d="M0 0 L55 0" stroke-width="35"/>
        <path class="wind-core" d="M0 -5 L55 -5" stroke-width="7"/>
        <path class="wind-core" d="M0 0 L55 0" stroke-width="7"/>
        <path class="wind-core" d="M0 5 L55 5" stroke-width="7"/>
        <path class="wind" d="M0 -12 L55 -12" stroke-width="1.3"/>
        <path class="wind" d="M0 -7 L55 -7" stroke-width="1.4"/>
        <path class="wind" d="M0 -2 L55 -2" stroke-width="1.3"/>
        <path class="wind" d="M0 3 L55 3" stroke-width="1.4"/>
        <path class="wind" d="M0 8 L55 8" stroke-width="1.3"/>
        <path class="wind" d="M0 13 L55 13" stroke-width="1.4"/>
        <path class="wind-turb" d="M0 -10 L55 -10" stroke-width="1"/>
        <path class="wind-turb" d="M0 7 L55 7" stroke-width="1"/>
        <path class="wind-turb" d="M0 15 L55 15" stroke-width="1"/>
      </g>
      <g id="flow-feet" style="display:none" transform="translate(67 74) rotate(105)">
        <path class="wind-body" d="M0 0 L80 0" stroke-width="35"/>
        <path class="wind-core" d="M0 -5 L80 -5" stroke-width="7"/>
        <path class="wind-core" d="M0 0 L80 0" stroke-width="7"/>

        <path class="wind" d="M0 8 L80 8" stroke-width="1.3"/>
        <path class="wind" d="M0 13 L80 13" stroke-width="1.4"/>

           stroke-linecap="round" stroke-linejoin="round">

  <div class="dir-grid">
    <button class="dir-btn" data-dir="0" onclick="setDir(0)" title="Стекло">
      <svg viewBox="0 0 40 40">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">

          <path d="M13 7 L9.5 13 L16.5 13 Z"/><path d="M20 7 L16.5 13 L23.5 13 Z"/><path d="M27 7 L23.5 13 L30.5 13 Z"/>
        </g>
      </svg>
    </button>
    <button class="dir-btn" data-dir="1" onclick="setDir(1)" title="Стекло+Ноги">
      <svg viewBox="0 0 40 40">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M13 21 C11 17 15 13 13 8"/><path d="M20 21 C18 17 22 13 20 8"/><path d="M27 19 C25 23 29 27 27 32"/><path d="M20 19 C18 23 22 27 20 32"/>
        </g>
        <g fill="currentColor">
          <path d="M13 5 L9.5 11 L16.5 11 Z"/><path d="M20 5 L16.5 11 L23.5 11 Z"/><path d="M27 35 L23.5 29 L30.5 29 Z"/><path d="M20 35 L16.5 29 L23.5 29 Z"/>
        </g>
      </svg>
    </button>
    <button class="dir-btn active" data-dir="2" onclick="setDir(2)" title="Лицо">
      <svg viewBox="0 0 40 40">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M8 13 C16 11 22 15 30 13"/><path d="M8 20 C16 18 22 22 30 20"/><path d="M8 27 C16 25 22 29 30 27"/>
        </g>
        <g fill="currentColor">

    <button class="dir-btn" data-dir="3" onclick="setDir(3)" title="Ноги">

        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M13 8 C11 16 15 22 13 30"/><path d="M20 8 C18 16 22 22 20 30"/><path d="M27 8 C25 16 29 22 27 30"/>
        </g>
        <g fill="currentColor">
          <path d="M13 35 L9.5 29 L16.5 29 Z"/><path d="M20 35 L16.5 29 L23.5 29 Z"/><path d="M27 35 L23.5 29 L30.5 29 Z"/>
        </g>
      </svg>
    </button>
  </div>

  <div class="fan-block" id="fanBlock">
    <button class="fan-btn fan-small" onclick="changeFan(-1)" title="Уменьшить">
      <svg viewBox="0 0 24 24">
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z"/>
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z" transform="rotate(90 12 12)"/>
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z" transform="rotate(180 12 12)"/>
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z" transform="rotate(270 12 12)"/>

    <div class="fan-center">
      <div class="fan-value" id="fanValue"></div>
      <div class="fan-label" id="fanLabel"></div>
      <div class="fan-bars">
        <div class="fan-seg" id="seg0"></div><div class="fan-seg" id="seg1"></div>
        <div class="fan-seg" id="seg2"></div><div class="fan-seg" id="seg3"></div>
        <div class="fan-seg" id="seg4"></div>
      </div>
    </div>
    <button class="fan-btn fan-big" onclick="changeFan(1)" title="Увеличить">
      <svg viewBox="0 0 24 24">
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z"/>
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z" transform="rotate(90 12 12)"/>
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z" transform="rotate(180 12 12)"/>
        <path class="blade" d="M12 11.8 C11.5 9.5 12.2 6 14 4.2 C14.4 6.5 13.3 9.5 12 11.8 Z" transform="rotate(270 12 12)"/>
        <circle class="hub" cx="12" cy="12" r="1.2"/>

  <button class="connect-btn" id="connectBtn">Подключить</button>
  <div class="status" id="status">USB не подключён</div>
</div>

<div class="calib-overlay" id="calibOverlay">
  <div class="calib-panel">
    <div class="calib-head">
      <span>Калибровка серв</span>
      <button onclick="closeCalib()">Закрыть</button>
    </div>
    <div class="calib-log" id="calibLog">— лог пуст —</div>
    <div class="calib-grid">
      <button class="calib-btn accent" onclick="send('CAL')">CAL</button>
      <button class="calib-btn" onclick="send('S0')">S0 вент</button>
      <button class="calib-btn" onclick="send('S1')">S1 темп</button>
      <button class="calib-btn" onclick="send('S2')">S2 напр</button>
      <button class="calib-btn" onclick="send('+')">+ 5°</button>
      <button class="calib-btn" onclick="send('-')">− 5°</button>
      <button class="calib-btn" onclick="send('F0')">F0</button>
      <button class="calib-btn" onclick="send('F1')">F1</button>
      <button class="calib-btn" onclick="send('F2')">F2</button>
      <button class="calib-btn" onclick="send('F3')">F3</button>
      <button class="calib-btn" onclick="send('F4')">F4</button>
      <button class="calib-btn" onclick="send('F5')">F5</button>
      <button class="calib-btn" onclick="send('D0')">D0</button>
      <button class="calib-btn" onclick="send('D1')">D1</button>
      <button class="calib-btn" onclick="send('D2')">D2</button>
      <button class="calib-btn" onclick="send('D3')">D3</button>
      <button class="calib-btn accent" onclick="send('E')">E выход</button>
      <button class="calib-btn danger" onclick="clearLog()">Очистить</button>
    </div>
  </div>
</div>

<script>
window.onerror = function(msg, url, line){
  try {
    var s = document.getElementById('status');
    if (s) { s.textContent = 'ERR стр.' + line + ': ' + msg; s.style.color = '#ff4d5e'; }
  } catch(e) {}
  return false;
};

const $=id=>document.getElementById(id);
const S={temp:20.0,fan:0,dir:2};

try {
  const saved = JSON.parse(localStorage.getItem('climate') || 'null');
  if (saved && typeof saved.temp === 'number') Object.assign(S, saved);
} catch(e) {}

let isAPK = false;
(function waitBridge(n){
  if (typeof window.AndroidSerial !== 'undefined') { isAPK = true; return; }
  if (n <= 0) return;
  setTimeout(function(){ waitBridge(n-1); }, 100);
})(30);

let __saveTimer = null;
function saveState(){
  clearTimeout(__saveTimer);
  __saveTimer = setTimeout(function(){
    try { localStorage.setItem('climate', JSON.stringify(S)); } catch(e) {}
  }, 1500);
}

const FAN_ICON = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor"/><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor" transform="rotate(90 12 12)"/><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor" transform="rotate(180 12 12)"/><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor" transform="rotate(270 12 12)"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>';
const FAN_OFF  = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor"/><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor" transform="rotate(90 12 12)"/><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor" transform="rotate(180 12 12)"/><path d="M12 12 Q13.8 6.5 13.5 2.5 Q15.5 4.5 15.5 8.5 Q15.5 11 13 12.6 Z" fill="currentColor" transform="rotate(270 12 12)"/><circle cx="12" cy="12" r="2" fill="currentColor"/><line x1="2.5" y1="2.5" x2="21.5" y2="21.5" stroke="#ff4d5e" stroke-width="2.6" stroke-linecap="round"/></svg>';

const fanValueList = ['','','1','2','3','4'];
const fanLabelList = [FAN_OFF, FAN_ICON, '', '', '', ''];
const flowOpacity  = [0, 0.25, 0.5, 0.7, 0.85, 1.0];

function tempColor(t){
  var cold={r:74,g:158,b:255}, mid={r:220,g:235,b:255}, hot={r:255,g:107,b:107};
  var a,b,k;
  if(t<=23){a=cold;b=mid;k=(t-16)/7;} else {a=mid;b=hot;k=(t-23)/7;}
  k=Math.max(0,Math.min(1,k));
  return 'rgb('+Math.round(a.r+(b.r-a.r)*k)+','+Math.round(a.g+(b.g-a.g)*k)+','+Math.round(a.b+(b.b-a.b)*k)+')';
}
function applyWindColor(){
  document.documentElement.style.setProperty('--wind-color', tempColor(S.temp));
}

let port=null, writer=null, reader=null;
let isConnected = false;
let readerLoopActive = false;

async function connect(){
  if (isAPK) {
    if (isConnected) return;
    setStatus('Запрос USB...', true);
    if (!window.__apkHooked) {
      window.__apkHooked = true;
      window.addEventListener('serial-data', (e) => {
        const t = String(e.detail || '');
        if (t.indexOf('OK: connected') === 0) {
          isConnected = true; updateButton();
          setStatus('✓ Подключено', true);
          send('V' + S.fan);
          send(String(S.dir + 1));
          send('A' + Math.round(((S.temp-16)/14)*180));
        } else if (t.indexOf('OK: disconnected') === 0) {
          isConnected = false; updateButton();
          setStatus('USB отключён', false);
        } else if (t.indexOf('ERR') === 0) {
          setStatus(t, false);
          isConnected = false; updateButton();
        } else {
          appendLog(t);
        }
      });
    }
    window.AndroidSerial.connect();
    return;
  }

  if(!('serial' in navigator)){setStatus('Web Serial не поддерживается',false);return;}
  if (isConnected) return;
  try{
    port = await navigator.serial.requestPort();
    await port.open({baudRate:115200});
    writer = port.writable.getWriter();
    isConnected = true;
    updateButton();
    setStatus('Подключено, синхронизация...', true);
    startReader();
    await new Promise(r => setTimeout(r, 2000));
    send('V' + S.fan);
    send(String(S.dir + 1));
    send('A' + Math.round(((S.temp-16)/14)*180));
    setStatus('✓ Подключено', true);
  } catch(e) {
    setStatus('Ошибка подключения', false);
    writer = null; port = null; isConnected = false;
    updateButton();
  }
}

async function disconnect(){
  closeCalib();
  if (isAPK) {
    if (!isConnected) return;
    window.AndroidSerial.disconnect();
    return;
  }
  if (!port) return;
  try {
    if (reader) { try { await reader.cancel(); } catch(e) {} }
    if (writer) { try { writer.releaseLock(); } catch(e) {} }
    try { await port.close(); } catch(e) {}
  } catch(e) {}
  reader = null; writer = null; port = null;
  isConnected = false;
  updateButton();
  setStatus('USB отключён', false);
}

function updateButton(){
  const btn = $('connectBtn');
  if (isConnected) {
    btn.textContent = 'Отключить';
    btn.classList.add('danger');
  } else {
    btn.textContent = 'Подключить';
    btn.classList.remove('danger');
  }
}

async function startReader(){
  if (!port || !port.readable) return;
  if (readerLoopActive) return;
  readerLoopActive = true;
  const decoder = new TextDecoder();
  try {
    reader = port.readable.getReader();
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      if (value) appendLog(decoder.decode(value));
    }
  } catch(e) {
  } finally {
    try { if (reader) reader.releaseLock(); } catch(e) {}
    reader = null;
    readerLoopActive = false;
  }
}

function setStatus(t, ok){const el=$('status');el.textContent=t;el.classList.toggle('ok',ok);}

async function send(cmd){
  if (isAPK) {
    if (!isConnected) { appendLog('[!] нет подключения: ' + cmd); return; }
    try {
      window.AndroidSerial.send(cmd + '\n');
      appendLog('> ' + cmd);
      if (cmd === 'E') setTimeout(closeCalib, 300);
    } catch(e) {
      setStatus('Ошибка отправки', false);
    }
    return;
  }
  if (!writer) { appendLog('[!] нет подключения: ' + cmd); return; }
  try {
    await writer.write(new TextEncoder().encode(cmd + '\n'));
    appendLog('> ' + cmd);
    if (cmd === 'E') setTimeout(closeCalib, 300);
  } catch(e) {
    setStatus('Ошибка записи', false);
    writer = null; port = null; isConnected = false;
    updateButton();
  }
}

if ('serial' in navigator) {
  navigator.serial.addEventListener('disconnect', (e) => {
    if (port && (e.port === port || e.target === port)) {
      closeCalib();
      setStatus('USB отключён', false);
      reader = null; writer = null; port = null;
      isConnected = false;
      updateButton();
      readerLoopActive = false;
    }
  });
}

function appendLog(text){
  if (!$('calibOverlay').classList.contains('open')) return;
  const log = $('calibLog');
  if (log.textContent === '— лог пуст —') log.textContent = '';
  log.textContent += text;
  if (log.textContent.length > 4000) log.textContent = log.textContent.slice(-4000);
  log.scrollTop = log.scrollHeight;
}
function clearLog(){ $('calibLog').textContent = '— лог пуст —'; }

let audiTaps = 0, audiTimer = null;
$('audiLabel').addEventListener('click', () => {
  audiTaps++;
  clearTimeout(audiTimer);
  audiTimer = setTimeout(() => { audiTaps = 0; }, 600);
  if (audiTaps === 3) { audiTaps = 0; openCalib(); }
});
function openCalib(){ $('calibOverlay').classList.add('open'); }
function closeCalib(){ $('calibOverlay').classList.remove('open'); }
$('calibOverlay').addEventListener('click', (e) => {
  if (e.target === $('calibOverlay')) closeCalib();
});
window.openCalib = openCalib;
window.closeCalib = closeCalib;
window.clearLog = clearLog;
window.send = send;

function renderFan(){
  const i = S.fan;
  $('fanValue').textContent = fanValueList[i];
  $('fanLabel').innerHTML = fanLabelList[i];
  for(let k=0;k<5;k++) $('seg'+k).classList.toggle('active', k<i);
  document.documentElement.style.setProperty('--flow-opacity', flowOpacity[i]);
}

function changeFan(d){
  S.fan = Math.max(0, Math.min(5, S.fan+d));
  renderFan();
  saveState();
  send('V' + S.fan);
}
window.changeFan = changeFan;

let tempTimer = null;
$('tempSlider').addEventListener('input', e=>{
  S.temp = parseFloat(e.target.value);
  $('tVal').textContent = S.temp.toFixed(1);
  applyWindColor();
  saveState();
  clearTimeout(tempTimer);
  tempTimer = setTimeout(()=>{
    const angle = Math.round(((S.temp-16)/14)*180);
    send('A' + angle);
  }, 180);
});

function updateDirVisual(){
  document.querySelectorAll('.dir-btn').forEach(function(b){
    b.classList.toggle('active', parseInt(b.dataset.dir)===S.dir);
  });
}
function applyDirRotation(){
  var w=$('flow-wind'), f=$('flow-face'), ft=$('flow-feet');
  w.style.display='none'; f.style.display='none'; ft.style.display='none';
  if(S.dir===0){ w.style.display=''; }
  else if(S.dir===1){ w.style.display=''; ft.style.display=''; }
  else if(S.dir===2){ f.style.display=''; }
  else if(S.dir===3){ ft.style.display=''; }
}
function setDir(n){S.dir=n;updateDirVisual();applyDirRotation();saveState();send(String(S.dir+1));}
window.setDir=setDir;

$('tempSlider').value = S.temp;
$('tVal').textContent = S.temp.toFixed(1);
applyWindColor();
updateDirVisual();
applyDirRotation();
renderFan();

(function(){
  var saved = null;
  try { saved = localStorage.getItem('climate.lite'); } catch(e) {}
  var lite;
  if (saved === '1') lite = true;
  else if (saved === '0') lite = false;
  else {
    var isLandscape = window.innerWidth > window.innerHeight;
    lite = isLandscape;
  }
  document.body.classList.toggle('lite', lite);
  var btn = document.getElementById('liteToggle');
  if (btn) btn.classList.toggle('on', lite);
})();

window.toggleLite = function(){
  var on = document.body.classList.toggle('lite');
  var btn = document.getElementById('liteToggle');
  if (btn) btn.classList.toggle('on', on);
  try { localStorage.setItem('climate.lite', on ? '1' : '0'); } catch(e) {}
  setStatus(on ? 'LITE' : 'FULL', false);
  clearTimeout(window.__liteToast);
  window.__liteToast = setTimeout(function(){
    if (isConnected) setStatus('✓ Подключено', true);
    else setStatus('USB не подключён', false);
  }, 1200);
};

window.liteOn  = function(){ if(!document.body.classList.contains('lite')) toggleLite(); };
window.liteOff = function(){ if(document.body.classList.contains('lite')) toggleLite(); };
window.liteAuto = function(){ try{ localStorage.removeItem('climate.lite'); }catch(e){} location.reload(); };

$('connectBtn').addEventListener('click', function(){
  if (isConnected) disconnect();
  else connect();
});

setTimeout(function(){
  if (isAPK) {
    setStatus('Мост OK, USB не подключён', true);
  } else {
    setStatus('Мост НЕ найден — смотри тосты', false);
  }
}, 6000);
</script>
