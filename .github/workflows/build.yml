name: Build APK
on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Patch manifest + gradle + MainActivity
        run: |
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.hardware.usb.host" $MAN; then
            sed -i 's|<application|<uses-feature android:name="android.hardware.usb.host" android:required="true"/>\n  <application|' $MAN
          fi

          find android -name "*.gradle" -type f | while read f; do
            if ! grep -q "jitpack.io" "$f"; then
              sed -i 's|repositories {|repositories {\n        maven { url "https://jitpack.io" }|g' "$f"
            fi
          done

          GRAD=android/app/build.gradle
          if ! grep -q "usb-serial-for-android" $GRAD; then
            sed -i '/dependencies {/a\    implementation "com.github.mik3y:usb-serial-for-android:3.7.0"' $GRAD
          fi

          APP_DIR=android/app/src/main/java/ru/audi/climate
          mkdir -p $APP_DIR
          rm -f $APP_DIR/MainActivity.java
          rm -f $APP_DIR/MainActivity.kt
          cp android-extra/MainActivity.java $APP_DIR/MainActivity.java
          echo "=== files in $APP_DIR ==="
          ls -la $APP_DIR/

      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: climate-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
